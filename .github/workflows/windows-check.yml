name: windows-check

# The release workflow only BUILDS on Windows. This one runs there: the test suite, a real server with an offline
# chat that uses the agent's tools, and the packaged desktop app started and probed.
on:
  workflow_dispatch:
  push:
    branches: [windows-ci]

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: web
        shell: pwsh
        run: |
          cd web
          npm ci --silent
          npm run build --silent
      - name: pytest
        shell: pwsh
        run: uv run pytest -q -p no:cacheprovider -rfEs --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: junit-windows, path: junit.xml }

  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: web
        shell: pwsh
        run: |
          cd web
          npm ci --silent
          npm run build --silent
      - name: server + offline chat with tools
        shell: pwsh
        run: uv run python scripts/windows_smoke.py 8432

  bundle:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: build the desktop bundle (as the release does, without the installer)
        shell: pwsh
        run: |
          cd web; npm ci --silent; npm run build --silent; cd ..
          uv sync --extra desktop --group build
          uv run pyinstaller packaging/nesicode.spec --noconfirm --log-level WARN
      - name: start the packaged app and probe its server
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse dist -Filter *.exe | Where-Object { $_.Name -match '^(?i)nesicode\.exe$' } | Select-Object -First 1
          Write-Host "exe: $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          $port = $null
          for ($i = 0; $i -lt 90 -and -not $port; $i++) {
            Start-Sleep -Seconds 1
            $port = (Get-NetTCPConnection -OwningProcess $p.Id -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1).LocalPort
          }
          $log = Join-Path $env:APPDATA "nesicode\nesicode.log"
          if (-not $port) { if (Test-Path $log) { Get-Content $log -Tail 80 }; throw "the packaged app did not start its server" }
          Write-Host "app server on port $port"
          $h = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:$port/api/health"
          Write-Host "health: $($h.StatusCode) $($h.Content)"
          if ($h.StatusCode -ne 200) { throw "health check failed" }
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "the app exited" }
          if (Test-Path $log) { Write-Host "---- app log ----"; Get-Content $log -Tail 60 }
          Stop-Process -Id $p.Id -Force
