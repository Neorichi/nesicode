[project]
name = "nesicode"
version = "0.4.0"
description = "Self-improving coding agent with recursive harness optimization (Harness²-style) and a web UI"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "python-pptx>=1.0.2",
    "uvicorn[standard]>=0.54.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
nesicode = "nesicode.cli:main"

[project.optional-dependencies]
desktop = [
    "pywebview>=6.2.1",
    "pyobjc-framework-speech>=11; sys_platform == 'darwin'",
    "pyobjc-framework-avfoundation>=11; sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.2.0",
]
